name: Aegis release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: aegis-source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: prasanthece42/aegis-platform/.github/workflows/python-web-release.yml@49b631dc305692e5b709e285d43a22da80aa3bf3
    with:
      app-id: aegis-portal
