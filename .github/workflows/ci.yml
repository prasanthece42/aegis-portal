name: Portal CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - name: Verify generated contracts
        run: |
          python -m app.export_schemas
          git diff --exit-code -- schemas
      - name: Verify JavaScript and shell syntax
        run: |
          node --check app/static/app.js
          node --check tests/browser-smoke.cjs
          bash -n scripts/verify-container.sh
      - name: Build separate portal image
        run: docker build --tag aegis-portal:ci .
      - name: Verify non-root read-only container
        run: bash scripts/verify-container.sh aegis-portal:ci
